[workspace]
members = ["crates/lumen", "xtask", "xtask/clippy-fixture"]
resolver = "2"

[workspace.package]
authors = ["Lumen contributors"]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/flyingrobots/lumen"
rust-version = "1.96"
version = "0.1.0"

# Bunny's crates come in as git dependencies pinned to one full commit of Bunny's main, after
# the 0.7.1 release. `bunny-codec` has default features off: nothing it needs is behind
# `mesh-hash`, which would bring in `sha2` and its tree. They move to the registry when a
# release holds what lumen needs.
[workspace.dependencies]
bunny-broadphase = { git = "https://github.com/flyingrobots/bunny", rev = "2cd551e248d55407a8f27e84dcb26d1b1d8768bd" }
bunny-codec = { git = "https://github.com/flyingrobots/bunny", rev = "2cd551e248d55407a8f27e84dcb26d1b1d8768bd", default-features = false }
bunny-geom = { git = "https://github.com/flyingrobots/bunny", rev = "2cd551e248d55407a8f27e84dcb26d1b1d8768bd" }
bunny-linalg = { git = "https://github.com/flyingrobots/bunny", rev = "2cd551e248d55407a8f27e84dcb26d1b1d8768bd" }
bunny-num = { git = "https://github.com/flyingrobots/bunny", rev = "2cd551e248d55407a8f27e84dcb26d1b1d8768bd" }
bunny-optics = { git = "https://github.com/flyingrobots/bunny", rev = "2cd551e248d55407a8f27e84dcb26d1b1d8768bd" }
bunny-query = { git = "https://github.com/flyingrobots/bunny", rev = "2cd551e248d55407a8f27e84dcb26d1b1d8768bd" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
warnings = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
missing_panics_doc = "deny"
missing_errors_doc = "deny"

# Release builds link the whole program as one unit, so Bunny's kernels inline into lumen's
# render loop across the crate boundary: measured 6 to 18 % faster at 1, 4 and 18 threads
# (docs/adr/0003-row-bands.md). Integer-only arithmetic, so no pixel changes.
[profile.release]
codegen-units = 1
lto = "fat"

# Bunny's integer kernels run optimized even in debug builds and tests, so the brute-force
# oracle tests and a default-size render take seconds, not minutes. Lumen's own code keeps the
# debug profile. Optimization level does not change a pixel: the arithmetic is integer-only.
[profile.dev.package."*"]
opt-level = 2
