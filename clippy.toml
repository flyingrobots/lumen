msrv = "1.96.0"

# Nondeterminism bans (docs/adr/0006-nondeterminism-gate.md). Each reason starts with the rule
# ID it enforces, Echo's `ban-nondeterminism` vocabulary plus Lumen's `thread-spawn` and `float-type`.
# They apply to every crate in the workspace; code outside the deterministic core (the `lumen`
# binary, examples, integration tests, xtask) carries an `#[expect(..., reason = "<rule-id>: ...")]`
# where it uses one, and so does the scheduler's thread pool.
#
# For `std::env`, `std::fs`, `std::process` and `std::net`, every stable function and type of
# the pinned toolchain's documentation (std/all.html of rust-docs 1.96.0) is listed, except the
# address types of `std::net` (core's plain data, no socket and no lookup); constants such as
# `std::env::consts::OS` cannot be listed here and are the token scan's. Of `std::thread` the
# sleeps, the spawns and the core count; of `std::time` the clocks, and the float methods of
# `Duration`; of Bunny, every type and function that takes or returns a float. Of `std::thread`
# also its identity (`current`, `Thread`, `ThreadId`) and `LocalKey`, and of `std::io`, `hash`,
# `any` and `panic` the items xtask/src/clippy_bans/std_items/decisions.rs decides banned; the
# float aliases `c_double` and `c_float`; and `thread_local!`. Every entry must fire on
# xtask/clippy-fixture (`cargo run -p xtask -- clippy-bans`).

disallowed-types = [
